name: Publish to NuGet

# Manual only, on purpose: publishing to NuGet is irreversible (a version can
# never be re-uploaded or deleted once pushed, only unlisted/deprecated
# later), so this never fires on a normal push/PR — only when explicitly run
# from the Actions tab.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "publish" to confirm you want to push the current <Version> in AutoMapperLite.csproj to nuget.org'
        required: true

concurrency:
  group: publish-to-nuget
  cancel-in-progress: false

jobs:
  build-test-publish:
    runs-on: ubuntu-latest
    if: github.event.inputs.confirm == 'publish'
    # Must match the "Environment: release" scoping on the nuget.org Trusted
    # Publishing policy (atkhssn-nuget) exactly, or the OIDC token this job
    # gets won't carry a matching environment claim and NuGet's token
    # exchange fails with "No matching trust policy owned by user" (a
    # generic message that also fires for this mismatch, not just a
    # username mismatch).
    environment: release
    permissions:
      id-token: write # required for NuGet Trusted Publishing (OIDC token issuance)
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # All three SDK majors the Tests project targets are installed explicitly,
      # not just the newest one. Root cause of the repeated "MSB3030: Could not
      # copy ... net9.0/apphost because it was not found" failures on this
      # ubuntu-latest runner (confirmed by building net9.0 alone, in its own
      # `dotnet build` process, with no other TFM involved — it still failed,
      # ruling out any cross-TFM race or build-ordering explanation): only the
      # .NET 10 SDK was installed, so net10.0's apphost came from that SDK's own
      # bundled files, while net8.0/net9.0's apphosts had to be resolved as
      # separate NuGet packages (microsoft.netcore.app.host.linux-x64) — net8.0's
      # happened to resolve, net9.0's didn't. Installing the matching SDK for
      # every targeted TFM makes every apphost come from a local SDK install
      # instead of depending on that NuGet resolution at all.
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Restore
        run: dotnet restore AutoMapperLite.slnx

      # AutoMapperLite.Benchmarks is deliberately not built here — it's a
      # dev-only tool not needed for pack/test/publish.
      - name: Build (Release)
        run: |
          dotnet build AutoMapperLite.csproj -c Release --no-restore -m:1
          dotnet build AutoMapperLite.Tests/AutoMapperLite.Tests.csproj -c Release --no-restore -f net8.0 -m:1
          dotnet build AutoMapperLite.Tests/AutoMapperLite.Tests.csproj -c Release --no-restore -f net9.0 -m:1
          dotnet build AutoMapperLite.Tests/AutoMapperLite.Tests.csproj -c Release --no-restore -f net10.0 -m:1

      - name: Test (Release)
        run: dotnet test AutoMapperLite.Tests/AutoMapperLite.Tests.csproj -c Release --no-build

      - name: Pack
        run: dotnet pack AutoMapperLite.csproj -c Release --no-restore -o artifacts

      # Fails fast with an unambiguous message if the NUGET_USER repo secret
      # is missing/empty, instead of surfacing as NuGet/login@v1's generic
      # "Input required and not supplied: user" further down. Never prints
      # the value itself — only whether it's present and how long it is.
      - name: Verify NUGET_USER secret is set
        env:
          NUGET_USER: ${{ secrets.NUGET_USER }}
        run: |
          if [ -z "$NUGET_USER" ]; then
            echo "::error::NUGET_USER repository secret is empty or not set. Add it under Settings > Secrets and variables > Actions > Repository secrets (not Environment secrets)."
            exit 1
          fi
          echo "NUGET_USER is set (${#NUGET_USER} characters)."

      # Exchanges this run's GitHub OIDC token for a short-lived (~1 hour)
      # NuGet API key — no long-lived secret is stored anywhere. Requires a
      # matching Trusted Publishing policy configured on nuget.org for the
      # atkhssn/AutoMapperLite repo with Workflow File set to "publish.yml".
      - name: NuGet login (OIDC -> temp API key)
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: NuGet push
        run: >
          dotnet nuget push "artifacts/*.nupkg"
          --api-key ${{ steps.login.outputs.NUGET_API_KEY }}
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate
