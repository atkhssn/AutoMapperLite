name: Publish to NuGet

# Manual only, on purpose: publishing to NuGet is irreversible (a version can
# never be re-uploaded or deleted once pushed, only unlisted/deprecated
# later), so this never fires on a normal push/PR — only when explicitly run
# from the Actions tab.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "publish" to confirm you want to push the current <Version> in AutoMapperLite.csproj to nuget.org'
        required: true

concurrency:
  group: publish-to-nuget
  cancel-in-progress: false

jobs:
  build-test-publish:
    runs-on: ubuntu-latest
    if: github.event.inputs.confirm == 'publish'
    permissions:
      id-token: write # required for NuGet Trusted Publishing (OIDC token issuance)
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore AutoMapperLite.slnx

      # Each TargetFramework of AutoMapperLite.Tests (an exe project, since xunit.v3's
      # MTP self-hosting requires UseAppHost=true) is built as its OWN `dotnet build`
      # invocation, not via one multi-targeted `dotnet build AutoMapperLite.slnx`.
      # A single -m:1 (single-node) solution-wide build still hit, on this
      # ubuntu-latest runner, "MSB3030: Could not copy ... net9.0/apphost because it
      # was not found" for whichever TFM's inner build ran in the middle — net8.0 and
      # net10.0 both succeeded in the same run, only net9.0 failed, even though every
      # step logged "on node 1" (so it wasn't cross-node parallelism). That points to
      # the multi-targeting "outer build" dispatch mechanism itself, not MSBuild node
      # count — splitting each TFM into its own separate `dotnet build` process (via
      # -f) removes any possibility of TFMs interfering with each other's apphost
      # generation/copy. Not reproduced locally on Windows. AutoMapperLite.Benchmarks
      # is deliberately not built here — it's a dev-only tool not needed for
      # pack/test/publish, and skipping it removes another apphost-generation exe
      # from this workflow's risk surface.
      - name: Build (Release)
        run: |
          dotnet build AutoMapperLite.csproj -c Release --no-restore -m:1
          dotnet build AutoMapperLite.Tests/AutoMapperLite.Tests.csproj -c Release --no-restore -f net8.0 -m:1
          dotnet build AutoMapperLite.Tests/AutoMapperLite.Tests.csproj -c Release --no-restore -f net9.0 -m:1
          dotnet build AutoMapperLite.Tests/AutoMapperLite.Tests.csproj -c Release --no-restore -f net10.0 -m:1

      - name: Test (Release)
        run: dotnet test AutoMapperLite.Tests/AutoMapperLite.Tests.csproj -c Release --no-build

      - name: Pack
        run: dotnet pack AutoMapperLite.csproj -c Release --no-restore -o artifacts

      # Exchanges this run's GitHub OIDC token for a short-lived (~1 hour)
      # NuGet API key — no long-lived secret is stored anywhere. Requires a
      # matching Trusted Publishing policy configured on nuget.org for the
      # atkhssn/AutoMapperLite repo with Workflow File set to "publish.yml".
      - name: NuGet login (OIDC -> temp API key)
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: NuGet push
        run: >
          dotnet nuget push "artifacts/*.nupkg"
          --api-key ${{ steps.login.outputs.NUGET_API_KEY }}
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate
